{{define "content"}}
<h1>Account</h1>
<p class="sub">Logged in as <strong>{{.Admin.Username}}</strong>. Changing your password logs you out everywhere.</p>
{{with .Data}}{{with .Error}}<p class="error" role="alert">{{.}}</p>{{end}}{{end}}
<form class="card stack" method="post" action="/account/password">
  <label>Current password <input type="password" name="current" autocomplete="current-password" required></label>
  <label>New password (12 to 72 characters) <input type="password" name="password" autocomplete="new-password" minlength="12" maxlength="72" required></label>
  <label>Repeat new password <input type="password" name="confirm" autocomplete="new-password" minlength="12" maxlength="72" required></label>
  <div><button class="primary" type="submit">Change password</button></div>
</form>
{{end}}
